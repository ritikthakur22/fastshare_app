name: Feature Request
description: Suggest an improvement or new feature for FastShare
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or friction you ran into.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
      description: How would you like this to work?
    validations:
      required: true
