name: Bug Report
description: Report a bug or unexpected behavior in FastShare
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please fill out the details below so we can reproduce it.
  - type: input
    id: version
    attributes:
      label: App Version
      description: Found in Settings -> About (e.g. 2.0.2)
      placeholder: "2.0.2"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web Client
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & OS Version
      placeholder: "e.g. Redmi Note 9 (Android 12) / iPhone 14 (iOS 18)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open FastShare on...
        2. Tap...
        3. See error...
    validations:
      required: true
