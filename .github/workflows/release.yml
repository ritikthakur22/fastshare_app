name: Build and Release Android and iOS Apps

on:
  push:
    tags:
      - 'v*' # Triggers workflow on tag push (e.g. v1.1.9)

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Make Gradle executable
        run: chmod +x ./android/gradlew
        
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $KEYSTORE_BASE64 | base64 --decode > ./android/app/release.keystore
        
      - name: Build Android Release (APK & AAB)
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
        
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Sync Capacitor
        run: npx cap sync ios
        
      - name: Build iOS App
        working-directory: ./ios/App
        run: |
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: ./ios/App
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r app-release.ipa Payload
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: ios/App/app-release.ipa

  release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android-release
          
      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: ios-release
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-release/app-release.apk
            android-release/app-release.aab
            ios-release/app-release.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
